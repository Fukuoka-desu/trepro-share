name: Publish TrePro office infrastructure HTML

on:
  push:
    paths:
      - '.github/workflows/import-trepro-office-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild public HTML
        run: |
          set -euo pipefail
          mkdir -p docs
          cat \
            .publish/trepro-office-infrastructure.part1.b64 \
            .publish/trepro-office-infrastructure.part2.b64 \
            | base64 --decode \
            | gzip --decompress \
            > docs/trepro-office-infrastructure.html

          test "$(wc -c < docs/trepro-office-infrastructure.html)" -gt 80000
          grep -q "TREPRO Office Infrastructure Master" docs/trepro-office-infrastructure.html
          grep -q "ポータブルエアコン" docs/trepro-office-infrastructure.html

      - name: Commit published page
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/trepro-office-infrastructure.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish TrePro office infrastructure master"
          git push
